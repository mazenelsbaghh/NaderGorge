# Dedicated offline exam network. The Mac's Ethernet is 10.77.0.1/22.
interface=en0
bind-interfaces
listen-address=10.77.0.1
no-hosts
no-resolv
domain-needed

# More than 500 usable student leases; the AP has a fixed reservation.
dhcp-authoritative
dhcp-range=10.77.0.20,10.77.3.250,255.255.252.0,12h
dhcp-host=20:e1:5d:d3:6f:52,10.77.0.2
dhcp-option=option:router,10.77.0.1
dhcp-option=option:dns-server,10.77.0.1
dhcp-leasefile=/var/db/massar-exam-room/dnsmasq.leases
pid-file=/var/db/massar-exam-room/dnsmasq.pid
log-facility=/var/db/massar-exam-room/dnsmasq.log

# No Internet is required. Public hostname lookups stay on this LAN, allowing
# phones' HTTP connectivity checks to reach the local captive portal.
address=/#/10.77.0.1
