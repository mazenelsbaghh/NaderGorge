# Keep the PostgreSQL leader under the cluster's controlled maintenance workflow.
# An unattended package upgrade must not restart Patroni on its own.
$nrconf{override_rc}{qr(^patroni\.service$)} = 0;
# Redis and ingress restarts must use serialized cluster maintenance too.
# Automatic library-upgrade restarts interrupted the writer on 2026-10-03.
$nrconf{override_rc}{qr(^(redis-server|redis-sentinel|haproxy)\.service$)} = 0;
