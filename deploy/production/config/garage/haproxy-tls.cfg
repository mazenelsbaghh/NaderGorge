global
    log stdout format raw local0
    maxconn 128

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend garage_s3_tls
    bind 127.0.0.1:9443 ssl crt /run/secrets/backup-tls.pem
    default_backend garage_s3_plain

backend garage_s3_plain
    option tcp-check
    server local-garage 127.0.0.1:9000 check
