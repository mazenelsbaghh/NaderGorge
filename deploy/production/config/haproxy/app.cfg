global
    log stdout format raw local0
    maxconn 20000

defaults
    mode http
    log global
    # Query strings may carry SignalR bearer tokens. Log method and path only.
    log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %{+Q}HM %{+Q}HP %{+Q}HV"
    option dontlognull
    timeout connect 3s
    timeout client 65s
    timeout server 65s
    timeout tunnel 1h

frontend massar_ingress
    bind 127.0.0.1:8088
    acl approved_host hdr(host),lower,field(1,:) -m str massar-academy.net app.massar-academy.net admin.massar-academy.net teacher.massar-academy.net staff.massar-academy.net api.massar-academy.net ws.massar-academy.net assets.massar-academy.net
    acl signalr_hub path_beg /hubs/
    http-request deny deny_status 421 unless approved_host
    http-request set-header X-Forwarded-Proto https
    use_backend massar_signalr_nodes if signalr_hub
    acl massar_desktop_host hdr(host),lower,field(1,:) -m str api.massar-academy.net
    acl massar_desktop_path path_beg /v1/uploads /v1/updates/ /v1/releases/ /v1/admin/releases
    http-request set-log-level silent if massar_desktop_host massar_desktop_path
    use_backend massar_desktop_support if massar_desktop_host massar_desktop_path
    default_backend massar_nodes

backend massar_nodes
    balance roundrobin
    option httpchk
    http-check send meth GET uri /__node_ready hdr Host massar-academy.net
    http-check expect status 200
    server node-1 10.77.0.11:8080 check inter 2s fall 3 rise 2
    server node-2 10.77.0.12:8080 check inter 2s fall 3 rise 2
    server node-3 10.77.0.13:8080 check inter 2s fall 3 rise 2

backend massar_signalr_nodes
    balance roundrobin
    option httpchk
    http-check send meth GET uri /__node_ready hdr Host massar-academy.net
    http-check expect status 200
    server node-1 10.77.0.11:8080 check inter 2s fall 3 rise 2
    server node-2 10.77.0.12:8080 check inter 2s fall 3 rise 2
    server node-3 10.77.0.13:8080 check inter 2s fall 3 rise 2

backend massar_desktop_support
    mode http
    timeout server 310s
    server local_support 127.0.0.1:43880
