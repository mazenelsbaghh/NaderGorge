<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ميم · مصنع الأسباب</title>
  <link rel="icon" href="assets/mim.png">
  <link rel="stylesheet" href="three.css">
  <link rel="stylesheet" href="factory.css">
</head>
<body>
  <main>
    <div class="scene" id="scene">

      <div id="sockets" aria-label="فتحات توصيل الآلة"></div>
      <button id="power" disabled>شغّل الآلة</button>
    </div>
    <section id="panel" aria-label="مهمة المصنع">
      <h1>مصنع الأسباب <span id="count" dir="ltr">٠ / ٣</span></h1>
      <p id="feedback" role="status" aria-live="polite">اضغط سببًا على الآلة البرتقالية، ثم نتيجته على الآلة الزرقاء.</p>
    </section>
  </main>
  <nav class="toolbar" aria-label="أدوات المصنع">
    <button id="cameraReset">إعادة ضبط الكاميرا</button>
    <button id="again" hidden>العب من جديد</button>
    <a href="preview.html">ارجع للمغامرات</a>
  </nav>
  <p id="moveHelp">تحرّك بالعصا اليسرى · دوّر الكاميرا باليمنى · اضغط الأرض للمشي</p>
  <div class="touch-controls" aria-label="عصا الحركة وعصا الكاميرا">
    <div id="moveStick" class="thumbstick thumbstick-move" role="group" aria-label="عصا الحركة"><span class="thumbstick-label">حركة</span><span class="thumbstick-knob"></span></div>
    <div id="cameraStick" class="thumbstick thumbstick-camera" role="group" aria-label="عصا الكاميرا"><span class="thumbstick-label">كاميرا</span><span class="thumbstick-knob"></span></div>
  </div>
  <p id="loadError" role="alert" hidden>تعذّر تشغيل العالم ثلاثي الأبعاد. أعد تحميل الصفحة أو جرّب متصفحًا يدعم WebGL.</p>
  <script type="module" src="factory.mjs"></script>
</body>
</html>
