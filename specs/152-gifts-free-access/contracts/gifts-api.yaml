openapi: 3.0.3
info:
  title: Gifts and Free Access API
  version: 1.0.0
paths:
  /api/admin/gifts:
    get:
      summary: Search the gift ledger
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: targetType, schema: { $ref: '#/components/schemas/GiftTargetType' } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Paged ledger }
        '403': { description: Missing gifts.manage }
    post:
      summary: Issue one idempotent gift batch
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueGiftRequest' }
      responses:
        '200':
          description: Existing issuance returned for a replay
          content: { application/json: { schema: { $ref: '#/components/schemas/GiftDetails' } } }
        '201':
          description: Issuance created, including recipient outcomes
          content: { application/json: { schema: { $ref: '#/components/schemas/GiftDetails' } } }
        '400': { description: Invalid header or terms }
        '403': { description: Missing gifts.manage; no writes }
  /api/admin/gifts/{id}:
    get:
      summary: Get issuance and recipient evidence
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Gift details }
        '404': { description: Not found }
  /api/admin/gifts/{id}/revoke:
    post:
      summary: Revoke unused remainder idempotently
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { description: Current details, including already-revoked replay }
        '400': { description: Missing reason }
        '403': { description: Missing gifts.manage; no writes }
        '404': { description: Not found }
  /api/admin/gifts/lookups/students:
    get:
      summary: Search active students for recipient selection
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Minimal student lookup rows } }
  /api/admin/gifts/lookups/teachers:
    get:
      summary: Search teachers for restricted balances and targets
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Minimal teacher lookup rows } }
  /api/admin/gifts/lookups/targets:
    get:
      summary: Search valid targets by type and optional teacher
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: targetType, required: true, schema: { $ref: '#/components/schemas/GiftTargetType' } }
        - { in: query, name: teacherId, schema: { type: string, format: uuid } }
        - { in: query, name: search, schema: { type: string } }
      responses: { '200': { description: Stable ids, names, hierarchy, and teacher ownership } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    GiftTargetType:
      type: string
      enum: [package, lesson, video, exam, generalBalance, teacherBalance]
    IssueGiftRequest:
      type: object
      required: [requestId, targetType, studentIds, reason]
      properties:
        requestId: { type: string, format: uuid }
        targetType: { $ref: '#/components/schemas/GiftTargetType' }
        targetId: { type: string, format: uuid, nullable: true }
        teacherId: { type: string, format: uuid, nullable: true }
        amount: { type: number, format: decimal, minimum: 0, exclusiveMinimum: true, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        maxUses: { type: integer, minimum: 1, nullable: true }
        studentIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 500 }
    GiftDetails:
      type: object
      required: [id, requestId, targetType, status, reason, issuedAt, recipients]
      properties:
        id: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        targetType: { $ref: '#/components/schemas/GiftTargetType' }
        status: { type: string }
        reason: { type: string }
        issuedAt: { type: string, format: date-time }
        amount: { type: number, format: decimal, nullable: true }
        availableAmount: { type: number, format: decimal, nullable: true }
        consumedAmount: { type: number, format: decimal, nullable: true }
        expiredAmount: { type: number, format: decimal, nullable: true }
        revokedAmount: { type: number, format: decimal, nullable: true }
        recipients:
          type: array
          items:
            type: object
            required: [studentId, status, outcomeCode]
            properties:
              studentId: { type: string, format: uuid }
              studentName: { type: string }
              status: { type: string }
              outcomeCode: { type: string }
              outcomeMessage: { type: string, nullable: true }
              usesConsumed: { type: integer }
              maxUses: { type: integer, nullable: true }
