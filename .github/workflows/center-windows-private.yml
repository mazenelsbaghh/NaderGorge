name: Massar Windows private build

on:
  push:
    branches: [main]
    paths: ['desktop/center-flutter/**', 'desktop/center-lan/**', '.github/workflows/center-windows-private.yml']
  workflow_dispatch:
    inputs:
      private_assets_id:
        description: 'Reviewed private packaging release asset ID (host only)'
        required: true
        type: string
      private_assets_sha256:
        description: 'SHA256 of the reviewed private packaging asset'
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    if: github.event.repository.private == true
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        role: [host, client]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false
      - name: Load reviewed private host packaging assets
        if: matrix.role == 'host'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_ASSETS_ID: ${{ inputs.private_assets_id }}
          PRIVATE_ASSETS_SHA256: ${{ inputs.private_assets_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PRIVATE_ASSETS_ID -notmatch '^[0-9]+$' -or $env:PRIVATE_ASSETS_SHA256 -notmatch '^[a-f0-9]{64}$') {
            throw 'Dispatch this build with reviewed private packaging inputs.'
          }
          $Zip = Join-Path $env:RUNNER_TEMP 'massar-private-assets.zip'
          $Headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream' }
          Invoke-WebRequest "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$env:PRIVATE_ASSETS_ID" -Headers $Headers -OutFile $Zip
          if ((Get-FileHash $Zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:PRIVATE_ASSETS_SHA256) {
            throw 'Private packaging asset digest mismatch.'
          }
          $env:MASSAR_PRIVATE_ASSET_ZIP = $Zip
          @'
          import os, pathlib, zipfile
          root = pathlib.Path('desktop/center-flutter/assets')
          expected = {'admin_account.json', 'installation_seed.json', 'data_repair_20261002.json', 'data_repair_20261004.json', 'academic_import_20261004.json', 'cairo_academic_import_20261004.json', 'cairo_codes_20261004.json', 'gec_codes_20261004.json', 'gec_duplicate_codes_20261004.json', 'attendance_payment_repair_20261011.json'}
          with zipfile.ZipFile(os.environ['MASSAR_PRIVATE_ASSET_ZIP']) as archive:
              names = archive.namelist()
              if len(names) != len(expected) or set(names) != expected or archive.testzip() is not None:
                  raise RuntimeError('Unexpected private packaging archive contents')
              for name in names:
                  (root / name).write_bytes(archive.read(name))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Private asset loading failed.' }
      - name: Install official Flutter 3.41.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Base = 'https://storage.googleapis.com/flutter_infra_release/releases'
          $Index = Invoke-RestMethod 'https://storage.googleapis.com/flutter_infra_release/releases/releases_windows.json'
          $Release = @($Index.releases | Where-Object { $_.channel -eq 'stable' -and $_.version -eq '3.41.0' -and $_.dart_sdk_arch -eq 'x64' })
          if ($Release.Count -ne 1) { throw 'Expected one pinned Flutter release.' }
          $Zip = Join-Path $env:RUNNER_TEMP 'flutter-sdk.zip'
          Invoke-WebRequest "$Base/$($Release[0].archive)" -OutFile $Zip
          if ((Get-FileHash $Zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Release[0].sha256) { throw 'Flutter archive digest mismatch.' }
          $Sdk = Join-Path $env:RUNNER_TEMP 'massar-sdk'
          Expand-Archive -LiteralPath $Zip -DestinationPath $Sdk
          Join-Path $Sdk 'flutter/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Compile and package without tests
        shell: pwsh
        env:
          PACKAGE_ROLE: ${{ matrix.role }}
        run: |
          $Parameters = @{ SkipTests = $true; OutputTag = "run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" }
          if ($env:PACKAGE_ROLE -eq 'client') { $Parameters.ClientOnly = $true }
          & ./desktop/center-flutter/scripts/build-windows.ps1 @Parameters
      - uses: actions/upload-artifact@v7
        with:
          name: massar-windows-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            desktop/center-flutter/dist/*.zip
            desktop/center-flutter/dist/*.sha256
          if-no-files-found: error
          retention-days: 7
