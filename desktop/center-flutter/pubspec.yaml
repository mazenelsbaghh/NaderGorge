name: massar_center
description: تطبيق نادر جورج لإدارة السناتر أوفلاين
publish_to: none
version: 1.2.6+9
environment:
  sdk: ^3.11.0
dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  sqflite_common_ffi: 2.4.0
  cryptography: ^2.9.0
  crypto: ^3.0.7
  uuid: ^4.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  archive: 4.0.9
  xml: 6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/logo-light.svg
    - assets/admin_account.json
    - assets/installation_seed.json
    - assets/data_repair_20261002.json
    - assets/data_repair_20261004.json
    - assets/academic_import_20261004.json
    - assets/cairo_academic_import_20261004.json
    - assets/cairo_codes_20261004.json
    - assets/gec_codes_20261004.json
    - assets/gec_duplicate_codes_20261004.json
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
