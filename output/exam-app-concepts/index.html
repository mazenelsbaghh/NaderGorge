function notify(message){$('live').innerHTML='';const el=document.createElement('div');el.className='toast';el.textContent=message;$('live').append(el);clearTimeout(toastId);toastId=setTimeout(()=>$('live').innerHTML='',2800)}
function cards(){return people.map((p,i)=>({p,i})).filter(({p})=>(filter==='الكل'||filter===p.subject)&&(!query||p.name.includes(query)||p.subject.includes(query))).map(({p,i})=>`<button class="teacher" data-teacher="${i}"><div class="portrait"><span class="initial">${p.initial}</span><span class="subject">${p.subject}</span></div><div class="teacher-info"><h3>أ. ${p.name}</h3><small>${p.subject} · ${p.count} امتحانًا</small></div></button>`).join('')||'<p class="muted">مفيش مدرس مطابق للبحث. جرّب اسم أو مادة تانية.</p>'}
function exams(){return ['قانون أوم والدوائر الكهربية','اختبار شامل على الفصل الأول','مراجعة التيار الكهربي'].map((x,i)=>`<div class="exam-row"><div class="exam-icon">${icon('book')}</div><div class="exam-info"><h3>${x}</h3><small>${i?20:3} أسئلة · ${i?30:5} دقائق</small></div><button class="iconbtn" data-go="details" aria-label="افتح ${x}">${icon('arrow')}</button></div>`).join('')}
function home(){return `${heading('أهلًا يا يوسف 👋','مستعد لخطوة جديدة؟')}<section class="hero"><div><small>الثالث الثانوي · مساحة امتحاناتك</small><h1>${themes[theme].headline}</h1><p>${themes[theme].sub}</p>${btn('اكتشف الامتحانات '+icon('arrow'),'exams')}</div><div class="hero-art" aria-hidden="true"><i></i><i></i><i></i></div></section><div class="section-title"><h2>مدرسين تتابعهم</h2><button class="linkbtn" data-go="teachers">شوف الكل ←</button></div><div class="teachers">${cards()}</div><div class="section-title"><h2>جرّب مستواك النهارده</h2><span class="tag">جديد</span></div>${exams()}`}
function teacherPage(){let p=people[teacher];return `<div class="profile-cover"><div class="avatar">${p.initial}</div><div><small>${p.subject} · الثالث الثانوي</small><h1>أ. ${p.name}</h1><p>خطوة بخطوة لحد ما تتمكّن.</p></div></div><div class="stats"><div><strong>${p.count}</strong><small>امتحان متاح</small></div><div><strong>٦</strong><small>وحدات دراسية</small></div></div><div class="line"><h2>امتحانات المدرس</h2><button class="btn secondary" data-action="follow">تابع المدرس</button></div><div class="chips"><span class="tag">الفصل الأول</span><span class="tag">تدريب ومراجعة</span></div>${exams()}`}
function details(){return `${heading('قبل ما تبدأ','قانون أوم والدوائر الكهربية')}<div class="columns"><div><div class="panel"><span class="tag">امتحان تجريبي تفاعلي</span><h2 style="margin-top:14px">٣ أسئلة. ٥ دقائق. فرصة للتجربة.</h2><p class="muted">اختيار من متعدد، والنتيجة هتظهر بعد التسليم.</p><div class="stats"><div><strong>٣</strong><small>أسئلة</small></div><div><strong>٥</strong><small>دقائق</small></div><div><strong>٣</strong><small>درجات</small></div></div><button class="btn full" data-action="start">ابدأ الامتحان ${icon('arrow')}</button></div></div><div><h3>خد بالك من كام حاجة</h3><p class="muted" style="margin-top:14px">تقدر تغيّر إجاباتك وترجع لأي سؤال قبل التسليم.</p><p class="muted" style="margin-top:14px">في المعاينة دي الإجابات محفوظة مؤقتًا لحد ما تقفل الصفحة.</p><div class="notice">الهدف تعرف مستواك، وتفهم اللي محتاج تراجعه.</div></div></div>`}
function exam(){let q=questions[qIndex];return `<div class="line"><div><small class="muted">قانون أوم</small><h2>السؤال ${qIndex+1} من ٣</h2></div><div class="timer">${icon('clock')} <span id="timer">${time()}</span></div></div><div class="progress"><i style="transform:scaleX(${answers.filter(x=>x!==null).length/3})"></i></div><div class="columns"><section><h1 class="question">${q.q}</h1><div class="options">${q.o.map((o,i)=>`<button class="option" data-answer="${i}" aria-pressed="${answers[qIndex]===i}"><span class="letter">${['أ','ب','ج','د'][i]}</span>${o}${answers[qIndex]===i?icon('check'):''}</button>`).join('')}</div><div class="line" style="margin-top:24px"><button class="btn secondary" data-action="prev" ${qIndex===0?'disabled':''}>السابق</button>${qIndex<2?'<button class="btn" data-action="next">السؤال التالي ←</button>':'<button class="btn" data-action="submit">سلّم الامتحان</button>'}</div></section><aside class="panel"><h3>خريطة الأسئلة</h3><div class="question-map">${questions.map((_,i)=>`<button data-question="${i}" class="${answers[i]!==null?'done':''}" aria-label="السؤال ${i+1}${answers[i]!==null?'، تمت الإجابة':''}">${i+1}</button>`).join('')}</div><small class="muted">جاوبت ${answers.filter(x=>x!==null).length} من ٣ أسئلة</small><div class="notice">إجابتك قابلة للتغيير لحد التسليم.</div></aside></div>`}
function score(){return answers.reduce((n,a,i)=>n+(a===questions[i].a?1:0),0)}
function result(){let s=score();return `<div class="result"><span class="tag">${started?'نتيجتك في التجربة':'نموذج لشاشة النتيجة'}</span><h1 style="margin-top:15px">${s===3?'عاش! إجاباتك كلها صح.':'كل محاولة بتعلّمك حاجة.'}</h1><p class="muted">قانون أوم والدوائر الكهربية</p><div class="score"><strong>${started?Math.round(s/3*100):80}%</strong><small>درجتك النهائية</small></div><div class="stats"><div><strong>${started?s:8}</strong><small>إجابة صحيحة</small></div><div><strong>${started?3-s:2}</strong><small>للمراجعة</small></div><div><strong>${started?3:10}</strong><small>إجمالي الأسئلة</small></div></div>${btn('راجع الإجابات مع الشرح','review')}<div style="margin-top:13px">${btn('ارجع للرئيسية','home','secondary')}</div></div>`}
function review(){return `${heading('نفهم الحل سوا','راجع كل سؤال واعرف سبب الإجابة الصحيحة.')}${questions.map((q,i)=>`<section style="margin-bottom:30px"><small class="muted">السؤال ${i+1}</small><h3 style="margin-top:8px">${q.q}</h3><p class="muted" style="margin-top:10px">إجابتك: ${answers[i]===null?'لم تتم الإجابة':q.o[answers[i]]}</p><div class="review-answer">${icon('check')} الإجابة الصحيحة: ${q.o[q.a]}</div><p>${q.why}</p></section>`).join('')}${btn('اختار امتحان جديد','exams')}`}
function profile(){return `${heading('حسابي','تقدّم صغير كل يوم بيعمل فرق.')}<div class="profile-cover"><div class="avatar">ي</div><div><h2>يوسف أحمد</h2><p>الثالث الثانوي · علمي علوم</p></div></div><div class="stats"><div><strong>١٢</strong><small>امتحان مكتمل</small></div><div><strong>٨٤٪</strong><small>متوسط الدرجات</small></div><div><strong>٣</strong><small>مدرسين بتتابعهم</small></div></div><div class="columns"><section><h2>مستواك بيتقدّم</h2><div class="chart" aria-label="درجات توضيحية لآخر ٦ امتحانات: ٤٥، ٦٠، ٥٦، ٧٥، ٨٤، ٩٢ بالمئة">${[45,60,56,75,84,92].map(n=>`<div><i style="height:${n}%"></i></div>`).join('')}</div><small class="muted">آخر ٦ امتحانات · بيانات توضيحية</small></section><section><h2>آخر امتحاناتك</h2>${exams().replaceAll('data-go="details"','data-go="result"')}</section></div><button class="linkbtn" data-go="login">عرض شاشة تسجيل الدخول ←</button>`}
function login(){return `<div class="form">${heading('حلو إنك هنا.','ادخل حسابك وكمّل من آخر خطوة.')}<div class="brand" style="margin-bottom:30px"><span class="brand-mark">${icon('bolt')}</span>${themes[theme].name}</div><form id="loginForm"><label class="field">رقم الموبايل<input type="tel" inputmode="tel" pattern="01[0125][0-9]{8}" placeholder="01xxxxxxxxx" required dir="ltr" autocomplete="tel"></label><label class="field">كلمة المرور<input type="password" minlength="6" required placeholder="٦ أحرف على الأقل" autocomplete="current-password"></label><button class="btn full" type="submit">ادخل حسابك</button></form><p class="muted" style="margin-top:20px">نموذج عرض فقط. استخدم بيانات وهمية؛ مفيش بيانات بتتبعت.</p><button class="linkbtn" data-go="home">تصفّح الامتحانات الأول ←</button></div>`}
function admin(){return `${heading('صباح الخير، إدارة '+themes[theme].name,'نظرة على الامتحانات والمدرسين.')}<div class="line"><h2>إدارة المحتوى</h2>${btn('+ إضافة امتحان','editor')}</div><div class="stats"><div><strong>٥٨</strong><small>امتحان منشور</small></div><div><strong>٣</strong><small>مدرسين</small></div><div><strong>٧٢٤</strong><small>محاولة اليوم</small></div></div><div class="section-title"><h2>آخر الامتحانات</h2><span class="tag">بيانات توضيحية</span></div>${exams().replaceAll('data-go="details"','data-go="editor"')}<div class="section-title"><h2>المدرسين</h2></div><div class="teachers">${cards()}</div>`}
function editor(){return `${heading('إضافة امتحان','جهّز الأسئلة، وراجع الامتحان قبل نشره.')}<form id="editorForm"><div class="columns"><section><label class="field">عنوان الامتحان<input required value="قانون أوم والدوائر الكهربية"></label><div class="row"><label class="field" style="flex:1">المدرس<select>${people.map(p=>`<option>${p.name}</option>`).join('')}</select></label><label class="field" style="flex:1">المدة بالدقائق<input type="number" min="1" max="180" value="5" required></label></div><label class="field">السؤال الأول<textarea required>ما وحدة قياس المقاومة الكهربائية؟</textarea></label><label class="field">الإجابة الصحيحة<input required value="الأوم"></label></section><aside class="panel"><h3>مراجعة قبل النشر</h3><p class="muted">عنوان واضح، المدرس المناسب، ووقت كافي للحل.</p><div class="notice">الحفظ هنا تجريبي للعرض، بدون اتصال بقاعدة بيانات.</div><button class="btn full" type="submit">احفظ مسودة تجريبية</button><div style="margin-top:12px">${btn('عاين الامتحان','details','secondary full')}</div></aside></div></form>`}
function render(){const t=themes[theme];$('app').dataset.theme=theme;$('concepts').innerHTML=Object.entries(themes).map(([key,x])=>`<button class="concept" data-theme="${key}" aria-pressed="${key===theme}"><div class="swatches">${x.colors.map(c=>`<i style="background:${c}"></i>`).join('')}</div><span><strong>${x.name}</strong><small>${x.desc}</small></span></button>`).join('');$('pageSelect').value=page;$('sidebar').innerHTML=`<div class="brand"><span class="brand-mark">${icon('bolt')}</span>${t.name}</div><small class="muted">مساحتك للامتحانات</small><nav>${nav()}</nav><button class="navbtn ${page==='admin'?'active':''}" data-go="admin">${icon('settings')}لوحة الإدارة</button><div class="sidebar-foot"><strong>خطوة على قدّك، كل يوم.</strong>تصوّر مستقل للعرض والتجربة</div>`;$('appbar').innerHTML=`<div class="desktop-crumb"><strong>${pages[page]}</strong><small> / الثالث الثانوي</small></div><div class="brand mobile-brand"><span class="brand-mark">${icon('bolt')}</span>${t.name}</div><div class="row"><button class="iconbtn" data-action="notifications" aria-label="الإشعارات">${icon('bell')}</button><button class="avatar" data-go="profile" aria-label="حساب يوسف">ي</button></div>`;$('bottomnav').innerHTML=nav();$('themeNote').textContent=t.note;const content={home,teachers:()=>`${heading('مدرسك المفضّل هنا','اختار المادة، وابدأ مع المدرس اللي يناسبك.')}<label class="search">${icon('search')}<input id="teacherSearch" aria-label="ابحث عن مدرس أو مادة" placeholder="ابحث عن مدرس أو مادة"></label><div class="chips">${['الكل','فيزياء','كيمياء','رياضيات'].map(f=>`<button class="chip ${filter===f?'selected':''}" data-filter="${f}">${f}</button>`).join('')}</div><div class="teachers" id="teacherResults">${cards()}</div>`,teacher:teacherPage,exams:()=>`${heading('اختار تحدّيك الجاي','امتحانات قصيرة ومراجعات شاملة.')}<section class="hero"><div><small>ابدأ بتجربة بسيطة</small><h2>قانون أوم في ٣ أسئلة</h2><p>٥ دقائق تعرف بيهم النقاط اللي محتاج تراجعها.</p>${btn('جرّب الامتحان','details')}</div></section>${exams()}`,details,exam,result,review,profile,login,admin,editor};$('content').innerHTML=content[page]();$('content').classList.remove('enter');void $('content').offsetWidth;$('content').classList.add('enter');if($('teacherSearch'))$('teacherSearch').value=query}
function go(p){page=p;render()}
function time(){return Math.floor(remaining/60).toString().padStart(2,'0')+':'+(remaining%60).toString().padStart(2,'0')}
function start(){answers=[null,null,null];remaining=300;qIndex=0;started=true;clearInterval(timerId);timerId=setInterval(()=>{remaining--;if($('timer'))$('timer').textContent=time();if(remaining<=0){clearInterval(timerId);go('result');notify('انتهى الوقت واتحسبت نتيجتك.')}},1000);go('exam')}
$('pageSelect').innerHTML=Object.entries(pages).map(([p,n])=>`<option value="${p}">${n}</option>`).join('');$('pageSelect').addEventListener('change',e=>go(e.target.value));$('device').addEventListener('change',e=>$('app').classList.toggle('mobile',e.target.value==='mobile'));
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.theme){theme=b.dataset.theme;render()}else if(b.dataset.go)go(b.dataset.go);else if(b.dataset.teacher!==undefined){teacher=Number(b.dataset.teacher);go('teacher')}else if(b.dataset.filter){filter=b.dataset.filter;render()}else if(b.dataset.answer!==undefined){answers[qIndex]=Number(b.dataset.answer);if(!started)started=true;render()}else if(b.dataset.question!==undefined){qIndex=Number(b.dataset.question);render()}else if(b.dataset.action){switch(b.dataset.action){case'start':start();break;case'next':qIndex=Math.min(2,qIndex+1);render();break;case'prev':qIndex=Math.max(0,qIndex-1);render();break;case'submit':if(answers.includes(null)){notify('كمّل الأسئلة المتبقية قبل التسليم.');qIndex=answers.indexOf(null);render()}else{clearInterval(timerId);go('result')}break;case'follow':b.textContent=b.textContent==='بتتابعه ✓'?'تابع المدرس':'بتتابعه ✓';notify('اتحدّثت المتابعة في المعاينة.');break;case'notifications':notify('مفيش إشعارات جديدة. جاهز لامتحانك؟');break;}}});
document.addEventListener('input',e=>{if(e.target.id==='teacherSearch'){query=e.target.value;$('teacherResults').innerHTML=cards()}});document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='loginForm'){notify('تم الدخول التجريبي. أهلًا يا يوسف!');go('home')}else if(e.target.id==='editorForm'){notify('اتحفظت المسودة التجريبية في المعاينة.');go('admin')}});render();
</script>
</body></html>
