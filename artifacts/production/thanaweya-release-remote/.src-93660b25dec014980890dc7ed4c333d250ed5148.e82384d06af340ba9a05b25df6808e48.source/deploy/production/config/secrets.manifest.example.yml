# References only. Values must exist outside the repository with mode 0600.
root: /etc/massar/secrets
required:
  - etcd-root-password
  - etcd-patroni-password
  - postgres-app-password
  - postgres-superuser-password
  - postgres-replication-password
  - postgres-rewind-password
  - redis-password
  - jwt-secret
  - api-callback-secret
  - ai-callback-secret
  - worker-admin-token
  - parent-report-signing-secret
  - wireguard-private-key
  - etcd-ca.crt
  - etcd-server.crt
  - etcd-server.key
  - pgbackrest-repo-cipher-pass
  - s3-access-key
  - s3-secret-key
  - cloudflared-credentials.json
rules:
  owner: root
  group: massar
  file_mode: "0600"
  directory_mode: "0750"
  print_values: false
