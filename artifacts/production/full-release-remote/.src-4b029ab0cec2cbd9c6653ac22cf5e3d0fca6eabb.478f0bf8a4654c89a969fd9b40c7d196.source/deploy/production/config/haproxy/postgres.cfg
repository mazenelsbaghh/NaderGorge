global
    log /dev/log local0
    log /dev/log local1 notice
    stats socket /run/haproxy/admin.sock user massar-ops group haproxy mode 660 level admin
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout check 5s

frontend postgres_writer
    bind 0.0.0.0:6432
    timeout client 1h
    default_backend patroni_primary

backend patroni_primary
    timeout server 1h
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server node-1 10.77.0.11:5432 check port 8008
    server node-2 10.77.0.12:5432 check port 8008
    server node-3 10.77.0.13:5432 check port 8008

frontend massar_ingress
    bind 127.0.0.1:8088
    mode http
    option httplog
    timeout client 65s
    acl approved_host hdr(host),lower,field(1,:) -m str massar-academy.net app.massar-academy.net admin.massar-academy.net teacher.massar-academy.net staff.massar-academy.net api.massar-academy.net ws.massar-academy.net assets.massar-academy.net
    acl signalr_hub path_beg /hubs/
    http-request deny deny_status 421 unless approved_host
    http-request set-header X-Forwarded-Proto https
    use_backend massar_signalr_nodes if signalr_hub
    default_backend massar_nodes

backend massar_nodes
    mode http
    balance roundrobin
    option httpchk
    http-check send meth GET uri /__node_ready hdr Host massar-academy.net
    http-check expect status 200
    timeout server 65s
    timeout tunnel 1h
    server node-1 10.77.0.11:8080 check inter 2s fall 3 rise 2
    server node-2 10.77.0.12:8080 check inter 2s fall 3 rise 2
    server node-3 10.77.0.13:8080 check inter 2s fall 3 rise 2

backend massar_signalr_nodes
    mode http
    balance roundrobin
    cookie MASSAR_SIGNALR_NODE insert indirect nocache httponly secure
    option httpchk
    http-check send meth GET uri /__node_ready hdr Host massar-academy.net
    http-check expect status 200
    timeout server 65s
    timeout tunnel 1h
    server node-1 10.77.0.11:8080 check inter 2s fall 3 rise 2 cookie node-1
    server node-2 10.77.0.12:8080 check inter 2s fall 3 rise 2 cookie node-2
    server node-3 10.77.0.13:8080 check inter 2s fall 3 rise 2 cookie node-3
